<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --bg:#0b0d11; --panel:#151a22; --line:#252d3a; --fg:#e9edf3; --muted:#8b96a8; --accent:#5eead4; }
  body { width:300px; margin:0; padding:14px; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:15px; margin:0 0 12px; }
  h1 span { color:var(--accent); }
  input { width:100%; padding:8px 10px; margin-bottom:8px; background:var(--panel);
          border:1px solid var(--line); border-radius:8px; color:var(--fg); outline:none; font:inherit; }
  input:focus { border-color:var(--accent); }
  button.go { width:100%; padding:8px; background:var(--accent); color:#04211d;
              border:0; border-radius:8px; font-weight:650; cursor:pointer; font:inherit; }
  .row { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--muted); font-size:12px; }
  .row input[type=checkbox] { width:auto; margin:0; }
  .note { margin:12px 0 0; color:var(--muted); font-size:11.5px; line-height:1.45; }
  .note b { color:#fbbf24; }
  a { color:var(--accent); }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  li .h { flex:1; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; word-break:break-all; }
  li button { font:inherit; font-size:11.5px; padding:3px 10px; border-radius:6px;
              border:0; background:var(--accent); color:#04211d; font-weight:650; cursor:pointer; }
</style>
</head>
<body>
  <h1>▶ <span>Yarr.It</span></h1>

  <input id="q" placeholder="Search films, shows, music…" autofocus />
  <button class="go" id="search">Search</button>

  <hr />

  <input id="magnet" placeholder="Paste a magnet or info hash" />
  <button class="go" id="stream">Stream it</button>

  <div class="row">
    <input type="checkbox" id="hijack" />
    <label for="hijack">Open magnet links here instead of a torrent client</label>
  </div>
  <div class="row">
    <input type="checkbox" id="injectButtons" />
    <label for="injectButtons">Add ▶ buttons on torrent sites</label>
  </div>

  <div id="ask" hidden>
    <hr />
    <p class="note" style="margin:0 0 8px"><b>Yarr.It wants to reach your network</b></p>
    <ul id="asklist"></ul>
  </div>

  <p class="note">
    <b>Use a VPN.</b> Streaming is peer-to-peer from your browser — your IP is
    visible to other peers, exactly as with any torrent client.
  </p>
  <p class="note"><a href="#" id="opts">Manage home network access</a></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
